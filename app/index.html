<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#1E7EBE" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0E1A20" media="(prefers-color-scheme: dark)" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Booktracker" />
    <link rel="icon" href="/icons/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/icons/icon-192.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=DM+Mono:wght@400;500&display=swap" />
    <title>Booktracker</title>
  </head>
  <body>
    <div id="root"></div>
    <script>
      // Selbstheilung: Startet die App nicht (z. B. weil der Offline-Speicher eine kaputte Datei erwischt hat),
      // werden Offline-Speicher und Hintergrundprogramm gelöscht und die Seite einmal neu geladen.
      setTimeout(function () {
        if (window.__btBooted) return;
        try { if (sessionStorage.getItem("bt-heal")) return; sessionStorage.setItem("bt-heal", "1"); } catch (e) {}
        var jobs = [];
        if (navigator.serviceWorker) jobs.push(navigator.serviceWorker.getRegistrations().then(function (rs) { return Promise.all(rs.map(function (r) { return r.unregister(); })); }));
        if (window.caches) jobs.push(caches.keys().then(function (ks) { return Promise.all(ks.map(function (k) { return caches.delete(k); })); }));
        Promise.all(jobs).catch(function () {}).then(function () { location.reload(); });
      }, 8000);

      // Prüfung des Offline-Speichers: Hat er statt einer Programm- oder Gestaltungsdatei die Startseite
      // gespeichert (passiert, wenn eine Datei gerade während eines Updates abgerufen wurde), wird dieser
      // Eintrag gelöscht. Danach holt die App die Datei frisch aus dem Netz. Fehlt dadurch gerade die
      // Gestaltung, lädt die Seite einmal neu.
      window.addEventListener("load", function () {
        if (!window.caches) return;
        caches.keys().then(function (ks) {
          return Promise.all(ks.filter(function (k) { return k.indexOf("precache") >= 0; }).map(function (k) {
            return caches.open(k).then(function (c) {
              return c.keys().then(function (reqs) {
                return Promise.all(reqs.filter(function (r) { return /\/assets\/[^?]+\.(js|css)(\?|$)/.test(r.url); }).map(function (r) {
                  return c.match(r).then(function (res) {
                    var ct = (res && res.headers.get("content-type")) || "";
                    if (ct.indexOf("text/html") >= 0) return c.delete(r).then(function () { return true; });
                    return false;
                  });
                }));
              });
            });
          }));
        }).then(function (res) {
          var bad = [].concat.apply([], res).some(Boolean);
          var unstyled = !getComputedStyle(document.documentElement).getPropertyValue("--bg").trim();
          if (!bad && !unstyled) { try { sessionStorage.removeItem("bt-fix"); } catch (e) {} return; }
          try { if (sessionStorage.getItem("bt-fix")) return; sessionStorage.setItem("bt-fix", "1"); } catch (e) {}
          location.reload();
        }).catch(function () {});
      });
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
